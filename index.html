<!DOCTYPE html>
<html><body>
<h2>FitBuddy - AI Fitness Generator</h2>
<form action="/generate" method="post">
Age: <input type="number" name="age" required><br><br>
Weight: <input type="number" name="weight" required><br><br>
Height: <input type="number" name="height" required><br><br>
Goal: <select name="goal"><option>Weight Loss</option><option>Muscle Gain</option><option>Stay Fit</option></select><br><br>
Diet: <select name="diet"><option>Veg</option><option>Non-Veg</option><option>Vegan</option></select><br><br>
<button type="submit">Generate Plan</button>
</form>
</body></html>
